<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>好感度不是攻略，是回忆</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #171a20;
    overflow: hidden;
    color: #f2ece6;
    user-select: none;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #bg {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #2b3340, #3a2f3a 60%, #46392f);
    background-size: cover;
    background-position: center;
    transition: background-image .5s ease;
  }
  #bgShade {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(10,12,16,.25), rgba(10,12,16,.05) 35%, rgba(10,12,16,.65));
    pointer-events: none;
  }

  #chapterTitle {
    position: absolute;
    top: 22px; left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.72);
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    z-index: 5;
    opacity: 0;
    transition: opacity .4s ease;
  }
  #chapterTitle.show { opacity: 1; }

  #dialog {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px clamp(18px, 5vw, 64px) 26px;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, .82),
      rgba(255, 255, 255, .58) 40%,
      rgba(255, 255, 255, .18) 100%
    );
    border-top: 1px solid rgba(255, 255, 255, .75);
    box-shadow: 0 -8px 30px rgba(90, 50, 70, .10);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    cursor: pointer;
    min-height: 190px;
    z-index: 10;
  }

  #nameTagWrap {
    position: absolute;
    left: clamp(18px, 5vw, 64px);
    bottom: 100%;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 11;
    pointer-events: none;
  }

  #avatarImg {
    width: 76px;
    height: 76px;
    object-fit: contain;
    display: none;
    filter: drop-shadow(0 4px 10px rgba(120, 80, 100, .35));
  }

  #nameText {
    padding: 6px 22px;
    border-radius: 12px;
    font-size: 15px;
    letter-spacing: 2px;
    white-space: nowrap;
    display: none;
    font-weight: 600;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #nameText.boy {
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, .92),
      rgba(200, 224, 242, .55) 55%,
      rgba(200, 224, 242, .15) 100%
    );
    color: #2a5a7a;
    box-shadow: 0 3px 12px rgba(91, 127, 158, .22);
    border: 1px solid rgba(255, 255, 255, .80);
    border-bottom-color: rgba(255, 255, 255, .35);
  }
  #nameText.girl {
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, .92),
      rgba(250, 218, 232, .55) 55%,
      rgba(250, 218, 232, .15) 100%
    );
    color: #7a3a52;
    box-shadow: 0 3px 12px rgba(179, 112, 140, .22);
    border: 1px solid rgba(255, 255, 255, .80);
    border-bottom-color: rgba(255, 255, 255, .35);
  }

  #dialogText {
    font-size: clamp(16px, 2.4vw, 18px);
    line-height: 1.95;
    color: #3f3038;
    text-shadow: 0 1px 3px rgba(255, 255, 255, .95), 0 0 2px rgba(255, 255, 255, .95);
    min-height: 66px;
    white-space: pre-wrap;
  }
  #dialogText.narration { color: #6a5a64; }
  #dialogText.prompt { color: #8a7a84; font-style: italic; }

  #hint {
    position: absolute;
    right: clamp(18px, 5vw, 64px);
    bottom: 12px;
    font-size: 12px;
    color: rgba(90, 60, 78, .70);
    letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(255, 255, 255, .95);
    animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: .9; } }

  #choices {
    position: absolute;
    left: 0; right: 0;
    bottom: 230px;
    padding: 0 clamp(24px, 9vw, 110px);
    display: none;
    z-index: 40;
  }
  #choices.show { display: block; }
  #choices button {
    display: block;
    width: 100%;
    margin: 0 0 12px;
    padding: 16px 22px;
    text-align: center;
    font-size: clamp(15px, 2.3vw, 16.5px);
    line-height: 1.6;
    color: #3f3038;
    font-weight: 500;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, .90),
      rgba(255, 255, 255, .55) 45%,
      rgba(255, 255, 255, .12) 100%
    );
    border: 1px solid rgba(255, 255, 255, .85);
    border-bottom-color: rgba(255, 255, 255, .30);
    border-radius: 14px;
    cursor: pointer;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 6px 18px rgba(90, 50, 70, .12);
    text-shadow: 0 1px 2px rgba(255, 255, 255, .95);
    transition: background .18s, transform .18s, border-color .18s, box-shadow .18s;
    animation: choiceIn .28s ease both;
  }
  #choices button:hover {
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 1),
      rgba(255, 255, 255, .70) 45%,
      rgba(255, 255, 255, .25) 100%
    );
    border-color: rgba(255, 255, 255, 1);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(90, 50, 70, .18);
  }
  #choices button:nth-child(1) { animation-delay: 0s; }
  #choices button:nth-child(2) { animation-delay: .06s; }
  #choices button:nth-child(3) { animation-delay: .12s; }
  @keyframes choiceIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  #cover {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 30px;
    background: linear-gradient(160deg, rgba(20,24,32,.55), rgba(40,26,34,.72));
    z-index: 50;
    background-size: cover;
    background-position: center;
  }
  #cover h1 {
    font-size: clamp(24px, 5.2vw, 34px);
    letter-spacing: 3px;
    margin: 0 0 18px;
    text-shadow: 0 4px 20px rgba(0,0,0,.5);
    line-height: 1.5;
  }
  #cover .sub {
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.7);
    margin-bottom: 14px;
    line-height: 2;
  }
  #cover .guess {
    font-size: 12.5px;
    letter-spacing: 1px;
    color: rgba(255,255,255,.48);
    margin-bottom: 36px;
    line-height: 1.9;
  }
  #cover button {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.1);
    color: #fff;
    padding: 13px 46px;
    border-radius: 999px;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: background .2s;
  }
  #cover button:hover { background: rgba(255,255,255,.22); }

  #chapterCard {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(8,10,14,.88);
    z-index: 45;
    cursor: pointer;
    padding: 30px;
    backdrop-filter: blur(3px);
  }
  #chapterCard.show { display: flex; }
  #chapterCard .num {
    font-size: 13px;
    letter-spacing: 6px;
    color: rgba(255,255,255,.42);
    margin-bottom: 18px;
  }
  #chapterCard .name {
    font-size: clamp(20px, 4.4vw, 26px);
    letter-spacing: 4px;
    color: #f2ece6;
    line-height: 1.7;
    text-shadow: 0 4px 24px rgba(0,0,0,.5);
    max-width: 80%;
  }
  #chapterCard .line {
    width: 46px;
    height: 1px;
    background: rgba(255,255,255,.28);
    margin: 26px auto 0;
  }
  #chapterCard .tip {
    position: absolute;
    bottom: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.38);
    letter-spacing: 2px;
    animation: blink 2s infinite;
  }

  #final {
    position: absolute; inset: 0;
    overflow-y: auto;
    padding: 60px 22px 50px;
    background: linear-gradient(160deg, rgba(16,20,28,.94), rgba(34,24,32,.96));
    display: none;
    z-index: 50;
  }
  #meteorCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  #final .inner {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
  }
  #endingImg {
    display: none;
    width: 100%;
    max-height: 340px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.4);
  }
  #endingTitle {
    font-size: clamp(20px, 4vw, 24px);
    letter-spacing: 4px;
    color: #f0e6ea;
    margin: 0 0 28px;
    text-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  #endingText {
    font-size: clamp(15.5px, 2.3vw, 17px);
    line-height: 2.2;
    color: #e6dde2;
    white-space: pre-wrap;
    text-align: left;
    padding: 24px 22px;
    border-radius: 18px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    margin-bottom: 28px;
  }
  #endingNote {
    font-size: 13px;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,.42);
    line-height: 2;
    margin-bottom: 34px;
  }
  #restartBtn {
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.07);
    color: #f2ece6;
    padding: 11px 30px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background .2s;
  }
  #restartBtn:hover { background: rgba(255,255,255,.16); }

  #photoOverlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8,10,14,.84);
    z-index: 60;
    cursor: pointer;
    padding: 24px;
  }
  #photoOverlay.show { display: flex; }
  #photoOverlay img {
    max-width: 100%;
    max-height: 76vh;
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    opacity: 0;
    transform: scale(.94);
    transition: opacity .55s ease, transform .55s ease;
  }
  #photoOverlay.show img {
    opacity: 1;
    transform: scale(1);
  }
  #photoFlash {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #photoOverlay.flash #photoFlash {
    animation: flashAnim .7s ease-out;
  }
  @keyframes flashAnim {
    0% { opacity: 0; }
    12% { opacity: .92; }
    100% { opacity: 0; }
  }
  #photoHint {
    position: absolute;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.42);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bg"></div>
  <div id="bgShade"></div>

  <div id="chapterTitle"></div>

  <div id="choices"></div>

  <div id="dialog" onclick="advance()">
    <div id="nameTagWrap">
      <img id="avatarImg" src="" alt="">
      <span id="nameText"></span>
    </div>
    <div id="dialogText"></div>
    <div id="hint">点击继续</div>
  </div>

  <div id="chapterCard" onclick="enterChapter()">
    <div class="num" id="cardNum"></div>
    <div class="name" id="cardName"></div>
    <div class="line"></div>
    <div class="tip">点击进入</div>
  </div>

  <div id="photoOverlay" onclick="closePhoto(event)">
    <div id="photoFlash"></div>
    <img id="photoImg" src="" alt="">
    <div id="photoHint">点击继续</div>
  </div>

  <div id="cover">
    <h1>好感度不是攻略<br>是回忆</h1>
    <div class="sub">Easlyn 出品<br>to 优秀的人</div>
    <div class="guess">优秀的人会是谁呢？<br>你知道是谁？</div>
    <button onclick="startGame()">开 始</button>
  </div>

  <div id="final">
    <canvas id="meteorCanvas"></canvas>
    <div class="inner">
      <img id="endingImg" src="" alt="">
      <h2 id="endingTitle"></h2>
      <div id="endingText"></div>
      <div id="endingNote"></div>
      <button id="restartBtn" onclick="location.reload()">再玩一次</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   图片配置：只改这里
   格式：https://i.postimg.cc/xxxxxxx/xxx.png
===================================================== */
const IMG = {
  cover:  "https://i.postimg.cc/02xwBjfX/8e0dc3e1d797614328c8ac104efed4c9.png",
  ch1:    "https://i.postimg.cc/G3PRqm9w/ace926c35a5a8f7b8b67db1ec4e2d292.png",
  ch2:    "https://i.postimg.cc/Tw6bvP64/cdc8f30c4c884a95248b911f819e67f8.jpg",
  ch3:    "https://i.postimg.cc/yxwB2DqD/1a66f933aadd7e1b3d8e30c46dc56e93.jpg",
  ch4:    "https://i.postimg.cc/cHzN8vJZ/163aeab28ab45c0ba3ababb1b8703065.png",
  ch5:    "https://i.postimg.cc/Vkw5NVTq/9979fe4ac3bcab1205fdac1856078ec5.png",
  ch6:    "https://i.postimg.cc/634Bcrgx/4048557318405253fbe3c5fbb7413750.png",
  ch7:    "https://i.postimg.cc/zDnrfGrr/ead9ed5c2fde3e50aa21d6a0f41b8d79.png",

  // 第三章 大桥拍照定格那张
  photo1: "https://i.postimg.cc/43k2DJHS/pai-zhao.jpg",

  // 第七章 自拍那张（Bonan 的脸）—— 上传新图后把直链填这里
  selfie: "https://i.postimg.cc/自拍图",

  ending: "https://i.postimg.cc/结局图",
  avatarBoy:  "https://i.postimg.cc/g0L44rz5/IMG-8940.png",
  avatarGirl: "https://i.postimg.cc/fTMXky18/IMG-8945.png"
};
/* ===================================================== */

const CHAPTERS = [
  {
    title: "第一章 · 第一天上午 · 教堂到中央大街",
    img: IMG.ch1,
    lines: [
      { who: "narr", text: "索菲亚教堂的鸽子比想象中多。Easlyn 站在广场上抬头看。" },
      { who: "boy", text: "哟，冬天还真有鸽子。" },
      { who: "boy", text: "我一直以为就夏天有。" },
      { who: "girl", text: "给我拍照📷" },
      { who: "boy", text: "行，但我技术一般啊。" },
      { who: "girl", text: "拍就行了，又不要求你拍多好。" },
      { who: "narr", text: "快门按了两下。两人往中央大街走。人挺多，Bonan 走得时快时慢，又停下来等她。" },
      { who: "girl", text: "你腿长了不起啊，走那么快。" },
      { who: "boy", text: "我走得快吗？" },
      { who: "boy", text: "没注意。" },
      { who: "boy", text: "主要你太小只了。" },
      { who: "narr", text: "石板路很长。Easlyn 看着两边不算拥挤的人群。" },
      { who: "boy", text: "这儿其实没啥好玩的。" },
      { who: "boy", text: "主要晚上有氛围感。" },
      { who: "boy", text: "晚上有空可以再来。" },
      { who: "girl", text: "原来如此。" },
      { who: "narr", text: "走到中央大街尽头，快到中午了。Bonan 看了眼时间。" },
      { who: "boy", text: "饿了吧。" },
      { who: "boy", text: "带你去吃个东北菜。" }
    ],
    choice: {
      q: "Easlyn？",
      options: [
        { label: "“行，你带路”", tone: "fun",
          reply: [
            { who: "boy", text: "走，六泰居。" },
            { who: "girl", text: "听名字还挺高大上的。" },
            { who: "narr", text: "两人拐进街边，往饭馆走。" }
          ]},
        { label: "“是有点饿了，走”", tone: "straight",
          reply: [
            { who: "boy", text: "那快点，中午人多。" },
            { who: "girl", text: "okokokokk。" },
            { who: "narr", text: "Bonan 笑了一下，放慢了脚步。" }
          ]},
        { label: "“东北菜分量大，我们点两三个菜就行了吧”", tone: "soft",
          reply: [
            { who: "boy", text: "想吃什么就点什么，总得先尝尝都。" },
            { who: "girl", text: "行，那我到时候看看。" },
            { who: "narr", text: "两人往饭馆走，路上还在讨论点什么。" }
          ]}
      ]
    }
  },
  {
    title: "第二章 · 第一天中午 · 六泰居",
    img: IMG.ch2,
    lines: [
      { who: "narr", text: "已经悄然到达啊两个人。" },
      { who: "boy", text: "你先看看想吃什么吧。" },
      { who: "girl", text: "来，我来看看。" },
      { who: "narr", text: "Bonan 点点头，递过去菜单，然后推荐了几个菜。" },
      { who: "girl", text: "我要炒一本。" },
      { who: "boy", text: "ok啊直接破产。" },
      { who: "boy", text: "孩子们，看我的吧。" }
    ],
    choice: {
      q: "Easlyn 把菜单往他那边推了推——",
      options: [
        { label: "“那你点，我尝尝你的眼光”", tone: "fun",
          reply: [
            { who: "boy", text: "行，我来看看。" },
            { who: "girl", text: "ok。" },
            { who: "narr", text: "来个锅包肉吧，品鉴一下东北正宗锅包肉。" },

            { who: "girl", text: "emmm yummy~。" },
            { who: "boy", text: "怎么样。" }
          ]},
        { label: "“御座~”", tone: "soft",
          reply: [
            { who: "narr", text: "不错儿~。" },
            { who: "girl", text: "笑死我。" }
          ]}
      ]
    }
  },
  {
    title: "第三章 · 第一天下午 · 江边、大桥和烤肉",
    img: IMG.ch3,
    lines: [
      { who: "narr", text: "吃完饭，两人往江边走。防洪纪念塔就在中央大街尽头。" },
      { who: "narr", text: "这里的风比想象中凉。Easlyn 缩了缩肩膀。Bonan 看了一眼，往风口那边站了半步。" }
    ],
    choice: {
      q: "Easlyn 看着他挡在风口的背影——",
      options: [
        { label: "“你这挡风挡得挺专业啊”", tone: "fun",
          reply: [
            { who: "boy", text: "要不要回去穿厚衣服。" },
            { who: "girl", text: "那倒不用，还能抗。" },
            { who: "narr", text: "不得不说哈尔滨的冬天，真冷。" },
            { who: "boy", text: "老东西。" },
            { who: "girl", text: "老东西。" }
          ]},
        { label: "“你站过来点，风口那边冷”", tone: "straight",
          reply: [
            { who: "narr", text: "Bonan 愣了一下，往她那边挪了一步。" },
            { who: "boy", text: "这样？" },

            { who: "boy", text: "那你怎么不早说。" },
            { who: "girl", text: "现在说也不晚。" }
          ]},
        { label: "“你穿这么少还替我挡风，够意思”", tone: "soft",
          reply: [
            { who: "boy", text: "没事，我不冷。" },

let state = null;

(function setCoverBg() {
  const cover = document.getElementById("cover");
  if (IMG.cover) {
    cover.style.background =
      `linear-gradient(160deg, rgba(20,24,32,.55), rgba(40,26,34,.72)), url('${IMG.cover}') center/cover`;
  }
})();

(function setupAvatarError() {
  const avatarImg = document.getElementById("avatarImg");
  avatarImg.onerror = function() {
    this.style.display = "none";
  };
})();

function startGame() {
  document.getElementById("cover").style.display = "none";
  state = {
    chapter: 0,
    lines: [],
    idx: 0,
    phase: "intro",
    current: null,
    pendingNext: false,
    pendingEnding: null
  };
  loadChapter(0);
}

function setBg(img) {
  const bg = document.getElementById("bg");
  if (img) {
    bg.style.backgroundImage = `url('${img}')`;
  } else {
    bg.style.backgroundImage = "";
    bg.style.background = "linear-gradient(160deg, #2b3340, #3a2f3a 60%, #46392f)";
  }
}

function loadChapter(i) {
  state.chapter = i;
  state.current = CHAPTERS[i];
  state.lines = state.current.lines;
  state.idx = 0;
  state.phase = "card";
  state.pendingNext = false;
  state.pendingEnding = null;

  setBg(state.current.img);

  hideNameTag();

  const titleEl = document.getElementById("chapterTitle");
  titleEl.classList.remove("show");
  titleEl.textContent = state.current.title;

  document.getElementById("dialog").style.display = "none";
  document.getElementById("choices").classList.remove("show");
  document.getElementById("choices").innerHTML = "";

  const card = document.getElementById("chapterCard");
  const parts = state.current.title.split(" · ");
  document.getElementById("cardNum").textContent = parts[0] || "";
  document.getElementById("cardName").textContent = parts.slice(1).join(" · ");
  card.classList.add("show");
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "fade .5s ease";
}

function enterChapter() {
  const card = document.getElementById("chapterCard");
  card.classList.remove("show");

  document.getElementById("dialog").style.display = "block";

  const titleEl = document.getElementById("chapterTitle");
  titleEl.textContent = state.current.title;
  titleEl.classList.add("show");

  state.phase = "intro";
  render();
}

function hideNameTag() {
  document.getElementById("avatarImg").style.display = "none";
  const nameText = document.getElementById("nameText");
  nameText.style.display = "none";
  nameText.textContent = "";
}

function showNameTag(who) {
  const avatarImg = document.getElementById("avatarImg");
  const nameText = document.getElementById("nameText");

  if (who === "boy") {
    nameText.textContent = "Bonan";
    nameText.className = "boy";
    nameText.style.display = "inline-block";

    if (IMG.avatarBoy) {
      avatarImg.src = IMG.avatarBoy;
      avatarImg.style.display = "block";
    } else {
      avatarImg.style.display = "none";
    }
  } else if (who === "girl") {
    nameText.textContent = "Easlyn";
    nameText.className = "girl";
    nameText.style.display = "inline-block";

    if (IMG.avatarGirl) {
      avatarImg.src = IMG.avatarGirl;
      avatarImg.style.display = "block";
    } else {
      avatarImg.style.display = "none";
    }
  } else {
    hideNameTag();
  }
}

function render() {
  const line = state.lines[state.idx];

  if (line.who === "photo") {
    showPhoto(line.text);
    return;
  }

  const text = document.getElementById("dialogText");

  if (line.who === "boy" || line.who === "girl") {
    showNameTag(line.who);
    text.className = "";
  } else {
    hideNameTag();
    text.className = "narration";
  }
  text.textContent = line.text;

  const dialog = document.getElementById("dialog");
  dialog.classList.remove("fade");
  void dialog.offsetWidth;
  dialog.classList.add("fade");

  document.getElementById("choices").classList.remove("show");
  document.getElementById("choices").innerHTML = "";

  document.getElementById("hint").textContent =
    state.phase === "choice" ? "" : "点击继续";
}

function advance() {
  if (state.phase === "choice") return;
  if (state.phase === "card") return;
  if (document.getElementById("photoOverlay").classList.contains("show")) return;

  if (state.phase === "prompt") {
    showChoices();
    return;
  }

  if (state.idx < state.lines.length - 1) {
    state.idx++;
    render();
    return;
  }

  if (state.phase === "intro") {
    showChoicePrompt();
    return;
  }

  if (state.phase === "reply") {
    afterReply();
    return;
  }

  if (state.phase === "next") {
    nextChapter();
    return;
  }
}

function afterReply() {
  if (state.pendingNext) {
    state.lines = state.current.next;
    state.idx = 0;
    state.phase = "next";
    state.pendingNext = false;
    render();
    return;
  }
  if (state.pendingEnding) {
    const key = state.pendingEnding;
    state.pendingEnding = null;
    showEnding(key);
    return;
  }
  nextChapter();
}

function nextChapter() {
  if (state.chapter < CHAPTERS.length - 1) {
    loadChapter(state.chapter + 1);
  }
}

function showChoicePrompt() {
  state.phase = "prompt";
  hideNameTag();

  const text = document.getElementById("dialogText");
  text.className = "prompt";
  text.textContent = state.current.choice.q;

  document.getElementById("hint").textContent = "点击继续";
}

function showChoices() {
  state.phase = "choice";
  const choice = state.current.choice;
  const box = document.getElementById("choices");
  box.innerHTML = "";

  choice.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.textContent = opt.label;
    btn.onclick = (e) => {
      e.stopPropagation();
      choose(i);
    };
    box.appendChild(btn);
  });

  box.classList.add("show");

  hideNameTag();
  const text = document.getElementById("dialogText");
  text.className = "prompt";
  text.textContent = choice.q;

  document.getElementById("hint").textContent = "";
}

function choose(i) {
  const opt = state.current.choice.options[i];

  if (opt.ending) {
    showEnding(opt.ending);
    return;
  }

  state.lines = opt.reply;
  state.idx = 0;
  state.phase = "reply";
  state.pendingNext = !!state.current.next;
  state.pendingEnding = opt.replyEnding || null;

  document.getElementById("choices").classList.remove("show");
  document.getElementById("choices").innerHTML = "";
  render();
}

/* ===== 拍照定格：先清空旧图，避免加载失败时显示上一次的图 ===== */
function showPhoto(src) {
  const overlay = document.getElementById("photoOverlay");
  const img = document.getElementById("photoImg");

  // 先清空，避免旧的 src 缓存
  img.removeAttribute("src");
  img.src = src;

  overlay.classList.add("show");
  overlay.classList.remove("flash");
  void overlay.offsetWidth;
  overlay.classList.add("flash");

  document.getElementById("hint").textContent = "";
}

function closePhoto(e) {
  if (e) e.stopPropagation();
  const overlay = document.getElementById("photoOverlay");
  overlay.classList.remove("show");
  overlay.classList.remove("flash");

  if (state.idx < state.lines.length - 1) {
    state.idx++;
    render();
  } else if (state.phase === "next") {
    nextChapter();
  } else if (state.phase === "reply") {
    afterReply();
  }
}

function showEnding(key) {
  const ending = ENDINGS[key];

  hideNameTag();

  document.getElementById("dialog").style.display = "none";
  document.getElementById("choices").style.display = "none";
  document.getElementById("chapterTitle").classList.remove("show");
  document.getElementById("chapterCard").classList.remove("show");

  const final = document.getElementById("final");
  final.style.display = "block";
  final.scrollTop = 0;

  const endingImg = document.getElementById("endingImg");
  if (IMG.ending) {
    endingImg.src = IMG.ending;
    endingImg.style.display = "block";
  } else {
    endingImg.style.display = "none";
  }

  document.getElementById("endingTitle").textContent = ending.title;
  document.getElementById("endingText").textContent = ending.text;
  document.getElementById("endingNote").textContent =
    "这个游戏是 Easlyn 做的。";

  document.getElementById("meteorCanvas").style.display = "none";
}

/* ===== 流星特效（保留函数，当前结局不触发） ===== */
let meteors = [];
let meteorTimer = null;
let meteorRaf = null;

function startMeteors() {
  const canvas = document.getElementById("meteorCanvas");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function spawn() {
    const w = canvas.clientWidth;
    meteors.push({
      x: Math.random() * w * 0.9 + w * 0.1,
      y: -40,
      vx: -(2.5 + Math.random() * 2),
      vy: 4 + Math.random() * 3,
      len: 80 + Math.random() * 80,
      life: 1,
      fade: 0.004 + Math.random() * 0.004
    });
  }

  spawn();
  meteorTimer = setInterval(spawn, 850);

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life -= m.fade;

      if (m.life <= 0 || m.y > h + 100 || m.x < -100) {
        meteors.splice(i, 1);
        continue;
      }

      const tailX = m.x - m.vx * (m.len / Math.max(m.vy, 1)) * 0.15;
      const tailY = m.y - m.vy * (m.len / Math.max(m.vy, 1)) * 0.15;

      const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
      grad.addColorStop(0, `rgba(255,255,255,${0.9 * m.life})`);
      grad.addColorStop(0.4, `rgba(200,220,255,${0.5 * m.life})`);
      grad.addColorStop(1, "rgba(200,220,255,0)");

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.95 * m.life})`;
      ctx.fill();
    }

    meteorRaf = requestAnimationFrame(draw);
  }
  draw();
}
</script>
