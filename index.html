<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>好感度不是攻略，是回忆</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #171a20;
    overflow: hidden;
    color: #f2ece6;
    user-select: none;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #bg {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, #2b3340, #3a2f3a 60%, #46392f);
    background-size: cover;
    background-position: center;
    transition: background-image .5s ease;
  }
  #bgShade {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(10,12,16,.25), rgba(10,12,16,.05) 35%, rgba(10,12,16,.65));
    pointer-events: none;
  }

  #chapterTitle {
    position: absolute;
    top: 22px; left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.72);
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    z-index: 5;
    opacity: 0;
    transition: opacity .4s ease;
  }
  #chapterTitle.show { opacity: 1; }

  #dialog {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 20px clamp(18px, 5vw, 64px) 24px;
    background: linear-gradient(to top, rgba(16,18,24,.94), rgba(16,18,24,.82));
    border-top: 1px solid rgba(255,255,255,.08);
    cursor: pointer;
    min-height: 190px;
    z-index: 10;
  }
  #nameTag {
    padding: 4px 16px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    color: #fff;
    display: none;
  }
  #nameTag.boy { display: inline-block; background: #5b7f9e; box-shadow: 0 3px 10px rgba(91,127,158,.4); }
  #nameTag.girl { display: inline-block; background: #b3708c; box-shadow: 0 3px 10px rgba(179,112,140,.4); }

  #dialogText {
    font-size: clamp(16px, 2.4vw, 18px);
    line-height: 1.95;
    color: #f2ece6;
    min-height: 66px;
    white-space: pre-wrap;
  }
  #dialogText.narration { color: #d8d2cc; }
  #dialogText.prompt { color: #c9bfb2; font-style: italic; }

  #hint {
    position: absolute;
    right: clamp(18px, 5vw, 64px);
    bottom: 12px;
    font-size: 12px;
    color: rgba(255,255,255,.45);
    letter-spacing: 1px;
    animation: blink 1.8s infinite;
  }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: .85; } }

  #choices {
    position: absolute;
    left: 0; right: 0;
    bottom: 230px;
    padding: 0 clamp(24px, 9vw, 110px);
    display: none;
    z-index: 40;
  }
  #choices.show { display: block; }
  #choices button {
    display: block;
    width: 100%;
    margin: 0 0 12px;
    padding: 16px 22px;
    text-align: center;
    font-size: clamp(15px, 2.3vw, 16.5px);
    line-height: 1.6;
    color: #f2ece6;
    background: rgba(24,28,36,.92);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .18s, transform .18s, border-color .18s;
    animation: choiceIn .28s ease both;
  }
  #choices button:hover {
    background: rgba(56,62,76,.96);
    border-color: rgba(255,255,255,.42);
    transform: translateY(-2px);
  }
  #choices button:nth-child(1) { animation-delay: 0s; }
  #choices button:nth-child(2) { animation-delay: .06s; }
  #choices button:nth-child(3) { animation-delay: .12s; }
  @keyframes choiceIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  #cover {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 30px;
    background: linear-gradient(160deg, rgba(20,24,32,.55), rgba(40,26,34,.72));
    z-index: 50;
    background-size: cover;
    background-position: center;
  }
  #cover h1 {
    font-size: clamp(24px, 5.2vw, 34px);
    letter-spacing: 3px;
    margin: 0 0 18px;
    text-shadow: 0 4px 20px rgba(0,0,0,.5);
    line-height: 1.5;
  }
  #cover .sub {
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.7);
    margin-bottom: 14px;
    line-height: 2;
  }
  #cover .guess {
    font-size: 12.5px;
    letter-spacing: 1px;
    color: rgba(255,255,255,.48);
    margin-bottom: 36px;
    line-height: 1.9;
  }
  #cover button {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.1);
    color: #fff;
    padding: 13px 46px;
    border-radius: 999px;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: background .2s;
  }
  #cover button:hover { background: rgba(255,255,255,.22); }

  #chapterCard {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(8,10,14,.88);
    z-index: 45;
    cursor: pointer;
    padding: 30px;
    backdrop-filter: blur(3px);
  }
  #chapterCard.show { display: flex; }
  #chapterCard .num {
    font-size: 13px;
    letter-spacing: 6px;
    color: rgba(255,255,255,.42);
    margin-bottom: 18px;
  }
  #chapterCard .name {
    font-size: clamp(20px, 4.4vw, 26px);
    letter-spacing: 4px;
    color: #f2ece6;
    line-height: 1.7;
    text-shadow: 0 4px 24px rgba(0,0,0,.5);
    max-width: 80%;
  }
  #chapterCard .line {
    width: 46px;
    height: 1px;
    background: rgba(255,255,255,.28);
    margin: 26px auto 0;
  }
  #chapterCard .tip {
    position: absolute;
    bottom: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.38);
    letter-spacing: 2px;
    animation: blink 2s infinite;
  }

  #final {
    position: absolute; inset: 0;
    overflow-y: auto;
    padding: 60px 22px 50px;
    background: linear-gradient(160deg, rgba(16,20,28,.94), rgba(34,24,32,.96));
    display: none;
    z-index: 50;
  }
  #meteorCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  #final .inner {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
  }
  #endingImg {
    display: none;
    width: 100%;
    max-height: 340px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.4);
  }
  #endingTitle {
    font-size: clamp(20px, 4vw, 24px);
    letter-spacing: 4px;
    color: #f0e6ea;
    margin: 0 0 28px;
    text-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  #endingText {
    font-size: clamp(15.5px, 2.3vw, 17px);
    line-height: 2.2;
    color: #e6dde2;
    white-space: pre-wrap;
    text-align: left;
    padding: 24px 22px;
    border-radius: 18px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    margin-bottom: 28px;
  }
  #endingNote {
    font-size: 13px;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,.42);
    line-height: 2;
    margin-bottom: 34px;
  }
  #restartBtn {
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.07);
    color: #f2ece6;
    padding: 11px 30px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background .2s;
  }
  #restartBtn:hover { background: rgba(255,255,255,.16); }

  #photoOverlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8,10,14,.84);
    z-index: 60;
    cursor: pointer;
    padding: 24px;
  }
  #photoOverlay.show { display: flex; }
  #photoOverlay img {
    max-width: 100%;
    max-height: 76vh;
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
    opacity: 0;
    transform: scale(.94);
    transition: opacity .55s ease, transform .55s ease;
  }
  #photoOverlay.show img {
    opacity: 1;
    transform: scale(1);
  }
  #photoFlash {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  #photoOverlay.flash #photoFlash {
    animation: flashAnim .7s ease-out;
  }
  @keyframes flashAnim {
    0% { opacity: 0; }
    12% { opacity: .92; }
    100% { opacity: 0; }
  }
  #photoHint {
    position: absolute;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.42);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bg"></div>
  <div id="bgShade"></div>

  <div id="chapterTitle"></div>

  <div id="choices"></div>

  <div id="dialog" onclick="advance()">
    <div id="nameTag"></div>
    <div id="dialogText"></div>
    <div id="hint">点击继续</div>
  </div>

  <div id="chapterCard" onclick="enterChapter()">
    <div class="num" id="cardNum"></div>
    <div class="name" id="cardName"></div>
    <div class="line"></div>
    <div class="tip">点击进入</div>
  </div>

  <div id="photoOverlay" onclick="closePhoto(event)">
    <div id="photoFlash"></div>
    <img id="photoImg" src="" alt="">
    <div id="photoHint">点击继续</div>
  </div>

  <div id="cover">
    <h1>好感度不是攻略<br>是回忆</h1>
    <div class="sub">Easlyn 出品<br>to 优秀的人</div>
    <div class="guess">优秀的人会是谁呢？<br>你知道是谁？</div>
    <button onclick="startGame()">开 始</button>
  </div>

  <div id="final">
    <canvas id="meteorCanvas"></canvas>
    <div class="inner">
      <img id="endingImg" src="" alt="">
      <h2 id="endingTitle"></h2>
      <div id="endingText"></div>
      <div id="endingNote"></div>
      <button id="restartBtn" onclick="location.reload()">再玩一次</button>
    </div>
  </div>
</div>

<script>

/* ===================================================== */

let state = null;

/* 封面背景图 */
(function setCoverBg() {
  const cover = document.getElementById("cover");
  if (IMG.cover) {
    cover.style.background =
      `linear-gradient(160deg, rgba(20,24,32,.55), rgba(40,26,34,.72)), url('${IMG.cover}') center/cover`;
  }
})();

function startGame() {
  document.getElementById("cover").style.display = "none";
  state = {
    chapter: 0,
    lines: [],
    idx: 0,
    phase: "intro",
    current: null,
    pendingNext: false
  };
  loadChapter(0);
}

function setBg(img) {
  const bg = document.getElementById("bg");
  if (img) {
    bg.style.backgroundImage = `url('${img}')`;
  } else {
    bg.style.backgroundImage = "";
    bg.style.background = "linear-gradient(160deg, #2b3340, #3a2f3a 60%, #46392f)";
  }
}

function loadChapter(i) {
  state.chapter = i;
  state.current = CHAPTERS[i];
  state.lines = state.current.lines;
  state.idx = 0;
  state.phase = "card";
  state.pendingNext = false;

  setBg(state.current.img);

  const titleEl = document.getElementById("chapterTitle");
  titleEl.classList.remove("show");
  titleEl.textContent = state.current.title;

  document.getElementById("dialog").style.display = "none";
  document.getElementById("choices").classList.remove("show");
  document.getElementById("choices").innerHTML = "";

  const card = document.getElementById("chapterCard");
  const parts = state.current.title.split(" · ");
  document.getElementById("cardNum").textContent = parts[0] || "";
  document.getElementById("cardName").textContent = parts.slice(1).join(" · ");
  card.classList.add("show");
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "fade .5s ease";
}

function enterChapter() {
  const card = document.getElementById("chapterCard");
  card.classList.remove("show");

  document.getElementById("dialog").style.display = "block";

  const titleEl = document.getElementById("chapterTitle");
  titleEl.textContent = state.current.title;
  titleEl.classList.add("show");

  state.phase = "intro";
  render();
}

function render() {
  const line = state.lines[state.idx];

  if (line.who === "photo") {
    showPhoto(line.text);
    return;
  }

  const nameTag = document.getElementById("nameTag");
  const text = document.getElementById("dialogText");

  if (line.who === "boy") {
    nameTag.className = "boy";
    nameTag.textContent = "Bonan";
    text.className = "";
  } else if (line.who === "girl") {
    nameTag.className = "girl";
    nameTag.textContent = "Easlyn";
    text.className = "";
  } else {
    nameTag.className = "";
    nameTag.textContent = "";
    text.className = "narration";
  }
  text.textContent = line.text;

  const dialog = document.getElementById("dialog");
  dialog.classList.remove("fade");
  void dialog.offsetWidth;
  dialog.classList.add("fade");

  document.getElementById("choices").classList.remove("show");
  document.getElementById("choices").innerHTML = "";

  document.getElementById("hint").textContent =
    state.phase === "choice" ? "" : "点击继续";
}

function advance() {
  if (state.phase === "choice") return;
  if (state.phase === "card") return;
  if (document.getElementById("photoOverlay").classList.contains("show")) return;

  if (state.phase === "prompt") {
    showChoices();
    return;
  }

  if (state.idx < state.lines.length - 1) {
    state.idx++;
    render();
    return;
  }

  if (state.phase === "intro") {
    showChoicePrompt();
    return;
  }

  if (state.phase === "reply") {
    if (state.pendingNext) {
      state.lines = state.current.next;
      state.idx = 0;
      state.phase = "next";
      state.pendingNext = false;
      render();
      return;
    }
    nextChapter();
    return;
  }

  if (state.phase === "next") {
    nextChapter();
    return;
  }
}

function nextChapter() {
  if (state.chapter < CHAPTERS.length - 1) {
    loadChapter(state.chapter + 1);
  }
}

function showChoicePrompt() {
  state.phase = "prompt";

  const nameTag = document.getElementById("nameTag");
  const text = document.getElementById("dialogText");
  nameTag.className = "";
  nameTag.textContent = "";
  text.className = "prompt";
  text.textContent = state.current.choice.q;

  document.getElementById("hint").textContent = "点击继续";
}

function showChoices() {
  state.phase = "choice";
  const choice = state.current.choice;
  const box = document.getElementById("choices");
  box.innerHTML = "";

  choice.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.textContent = opt.label;
    btn.onclick = (e) => {
      e.stopPropagation();
      choose(i);
    };
    box.appendChild(btn);
  });

  box.classList.add("show");

  const nameTag = document.getElementById("nameTag");
  const text = document.getElementById("dialogText");
  nameTag.className = "";
  nameTag.textContent = "";
  text.className = "prompt";
  text.textContent = choice.q;

  document.getElementById("hint").textContent = "";
}

function choose(i) {
  const opt = state.current.choice.options[i];

  if (opt.ending) {
    showEnding(opt.ending);
    return;
  }

  state.lines = opt.reply;
  state.idx = 0;
  state.phase = "reply";
  state.pendingNext = !!state.current.next;

  document.getElementById("choices").classList.remove("show");
  document.getElementById("choices").innerHTML = "";
  render();
}

function showPhoto(src) {
  const overlay = document.getElementById("photoOverlay");
  const img = document.getElementById("photoImg");

  img.src = src;
  overlay.classList.add("show");
  overlay.classList.remove("flash");
  void overlay.offsetWidth;
  overlay.classList.add("flash");

  document.getElementById("hint").textContent = "";
}

function closePhoto(e) {
  if (e) e.stopPropagation();
  const overlay = document.getElementById("photoOverlay");
  overlay.classList.remove("show");
  overlay.classList.remove("flash");

  if (state.idx < state.lines.length - 1) {
    state.idx++;
    render();
  } else if (state.phase === "next") {
    nextChapter();
  }
}

function showEnding(key) {
  const ending = ENDINGS[key];

  document.getElementById("dialog").style.display = "none";
  document.getElementById("choices").style.display = "none";
  document.getElementById("chapterTitle").classList.remove("show");
  document.getElementById("chapterCard").classList.remove("show");

  const final = document.getElementById("final");
  final.style.display = "block";
  final.scrollTop = 0;

  const endingImg = document.getElementById("endingImg");
  if (IMG.ending) {
    endingImg.src = IMG.ending;
    endingImg.style.display = "block";
  } else {
    endingImg.style.display = "none";
  }

  document.getElementById("endingTitle").textContent = ending.title;
  document.getElementById("endingText").textContent = ending.text;
  document.getElementById("endingNote").textContent =
    "这个游戏是 Easlyn 做的。\n你的选择，她想知道。";

  if (ending.meteor) {
    startMeteors();
  } else {
    document.getElementById("meteorCanvas").style.display = "none";
  }
}

/* ===== 流星特效 ===== */
let meteors = [];
let meteorTimer = null;
let meteorRaf = null;

function startMeteors() {
  const canvas = document.getElementById("meteorCanvas");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function spawn() {
    const w = canvas.clientWidth;
    meteors.push({
      x: Math.random() * w * 0.9 + w * 0.1,
      y: -40,
      vx: -(2.5 + Math.random() * 2),
      vy: 4 + Math.random() * 3,
      len: 80 + Math.random() * 80,
      life: 1,
      fade: 0.004 + Math.random() * 0.004
    });
  }

  spawn();
  meteorTimer = setInterval(spawn, 850);

  function draw() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life -= m.fade;

      if (m.life <= 0 || m.y > h + 100 || m.x < -100) {
        meteors.splice(i, 1);
        continue;
      }

      const tailX = m.x - m.vx * (m.len / Math.max(m.vy, 1)) * 0.15;
      const tailY = m.y - m.vy * (m.len / Math.max(m.vy, 1)) * 0.15;

      const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
      grad.addColorStop(0, `rgba(255,255,255,${0.9 * m.life})`);
      grad.addColorStop(0.4, `rgba(200,220,255,${0.5 * m.life})`);
      grad.addColorStop(1, "rgba(200,220,255,0)");

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.95 * m.life})`;
      ctx.fill();
    }

    meteorRaf = requestAnimationFrame(draw);
  }
  draw();
}
